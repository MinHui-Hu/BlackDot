                        <p className="text-gray-600 leading-relaxed text-sm md:text-base">
                          {item}
                        </p>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </main>

        {/* Footer with Contact Info */}
        <footer className="text-center pb-8 px-6 space-y-4">
          
          {/* Contact Card */}
          <div className="bg-white/80 backdrop-blur-sm p-4 rounded-2xl shadow-sm border border-pink-100 inline-block w-full max-w-xs">

              {content.contact.phone}
            </a>
          </div>

          <div className="block text-xs text-gray-400">
            © 2025 Dragon Ridge Resort.
          </div>
        </footer>

      </div>

      <style jsx global>{`

  );
};
